spring.datasource.url=${INCIDENT_DETECTIVE_DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/incident_detective}
spring.datasource.username=${INCIDENT_DETECTIVE_DATABASE_USER:incident_detective}
spring.datasource.password=${INCIDENT_DETECTIVE_DATABASE_PASSWORD:incident_detective_local}
spring.datasource.hikari.maximum-pool-size=${INCIDENT_DETECTIVE_DATABASE_POOL_SIZE:4}
spring.datasource.hikari.connection-timeout=3000
spring.flyway.enabled=true

incident-detective.rag.mode=pgvector
