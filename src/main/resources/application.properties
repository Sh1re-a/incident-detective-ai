spring.application.name=incident-detective
spring.profiles.default=replay
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration,org.springframework.boot.persistence.autoconfigure.PersistenceExceptionTranslationAutoConfiguration
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.config.import=optional:file:./local-secrets.properties
# Expose only a minimal health endpoint publicly. Metrics remain internal.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
# Empty by default: prefer same-origin/reverse proxy. Separate frontends must use
# an explicit comma-separated allowlist; wildcard origins are rejected.
incident-detective.api.cors.allowed-origins=${INCIDENT_DETECTIVE_API_ALLOWED_ORIGINS:}
incident-detective.ai.gemini-api-key=${GEMINI_API_KEY:}
incident-detective.ai.live-enabled=${INCIDENT_DETECTIVE_LIVE_AI_ENABLED:false}
incident-detective.ai.model-id=${GEMINI_MODEL_ID:gemini-3.1-flash-lite}
incident-detective.ai.thinking-level=${GEMINI_THINKING_LEVEL:MINIMAL}
incident-detective.ai.prompt-version=gemini-live-v6
incident-detective.ai.diagnosis.schema-resource=ai/diagnosis-schema-v4.json
incident-detective.rag.embedding-model=gemini-embedding-2
incident-detective.rag.embedding-dimensions=768
incident-detective.rag.embedding-format-version=search-result-v1
# Calibrated on runbook-retrieval-eval-v1 development cases only.
incident-detective.rag.minimum-similarity=0.6620781500197453
