spring.application.name=incident-detective
spring.profiles.default=replay
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration,org.springframework.boot.persistence.autoconfigure.PersistenceExceptionTranslationAutoConfiguration
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.config.import=optional:file:./local-secrets.properties
incident-detective.ai.gemini-api-key=${GEMINI_API_KEY:}
incident-detective.ai.live-enabled=${INCIDENT_DETECTIVE_LIVE_AI_ENABLED:false}
incident-detective.ai.model-id=${GEMINI_MODEL_ID:gemini-3.5-flash-lite}
incident-detective.ai.thinking-level=${GEMINI_THINKING_LEVEL:MINIMAL}
incident-detective.ai.prompt-version=gemini-live-v5
incident-detective.rag.embedding-model=gemini-embedding-2
incident-detective.rag.embedding-dimensions=768
incident-detective.rag.embedding-format-version=search-result-v1
incident-detective.rag.minimum-similarity=0.0
