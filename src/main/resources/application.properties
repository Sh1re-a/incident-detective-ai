spring.application.name=incident-detective
server.port=${PORT:8080}
spring.profiles.default=replay
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration,org.springframework.boot.persistence.autoconfigure.PersistenceExceptionTranslationAutoConfiguration
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.config.import=optional:file:./local-secrets.properties
# Expose only a minimal health endpoint publicly. Metrics remain internal.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
# Manual investigation spans are no-op locally unless explicitly enabled.
# Export remains a separate opt-in and Micrometer stays the metrics source.
management.opentelemetry.enabled=${INCIDENT_DETECTIVE_OTEL_ENABLED:false}
management.tracing.export.otlp.enabled=${INCIDENT_DETECTIVE_OTEL_EXPORT_ENABLED:false}
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
management.tracing.sampling.probability=${INCIDENT_DETECTIVE_OTEL_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.resource-attributes[service.namespace]=incident-detective-portfolio
management.opentelemetry.tracing.limits.max-attribute-value-length=120
management.opentelemetry.tracing.limits.max-attributes=48
# Empty by default: prefer same-origin/reverse proxy. Separate frontends must use
# an explicit comma-separated allowlist; wildcard origins are rejected.
incident-detective.api.cors.allowed-origins=${INCIDENT_DETECTIVE_API_ALLOWED_ORIGINS:}
incident-detective.ai.gemini-api-key=${GEMINI_API_KEY:}
incident-detective.ai.provider=${GOOGLE_GENAI_PROVIDER:developer_api}
incident-detective.ai.vertex-project=${GOOGLE_CLOUD_PROJECT:}
incident-detective.ai.vertex-location=${GOOGLE_CLOUD_LOCATION:global}
incident-detective.ai.live-enabled=${INCIDENT_DETECTIVE_LIVE_AI_ENABLED:false}
incident-detective.ai.model-id=${GEMINI_MODEL_ID:gemini-3.1-flash-lite}
incident-detective.ai.thinking-level=${GEMINI_THINKING_LEVEL:MINIMAL}
incident-detective.ai.prompt-version=gemini-live-v6
incident-detective.ai.diagnosis.schema-resource=ai/diagnosis-schema-v4.json
# Separate opt-in for the first real Google ADK runtime slice.
incident-detective.adk.enabled=${INCIDENT_DETECTIVE_ADK_ENABLED:false}
incident-detective.rag.embedding-model=gemini-embedding-2
incident-detective.rag.embedding-dimensions=768
incident-detective.rag.embedding-format-version=search-result-v1
incident-detective.rag.provider-transport=${GOOGLE_GENAI_PROVIDER:developer_api}
# Calibrated on runbook-retrieval-eval-v1 development cases only.
incident-detective.rag.minimum-similarity=0.6620781500197453
# Separate demo threshold. This must be evaluated before any production claim.
incident-detective.rag.knowledge.top-k=${INCIDENT_DETECTIVE_NORDLY_RAG_TOP_K:3}
incident-detective.rag.knowledge.minimum-similarity=${INCIDENT_DETECTIVE_NORDLY_RAG_MINIMUM_SIMILARITY:0.68}
