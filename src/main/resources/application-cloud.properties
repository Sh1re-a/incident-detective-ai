# Activate alongside the runtime profile on Cloud Run:
# SPRING_PROFILES_ACTIVE=rag,cloud
# Cloud Run captures stdout/stderr. Spring emits each entry as one JSON line,
# so Cloud Logging stores the structured members as jsonPayload fields.
logging.structured.format.console=logstash
logging.structured.json.rename.level=severity
logging.structured.json.add.service=incident-detective
logging.structured.json.add.log_schema=incident-detective-cloud-v1

# Bound exception output. Incident Lab lifecycle events never attach prompts,
# model payloads, evidence content, customer data or exception messages.
logging.structured.json.stacktrace.max-length=4096
logging.structured.json.stacktrace.max-throwable-depth=8
logging.structured.json.stacktrace.include-common-frames=false
